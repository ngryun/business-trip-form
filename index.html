<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여비정산신청서 작성</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button type="button" id="btn-toggle-panel" class="panel-toggle" aria-label="입력 폼 펼치기/접기" title="입력 폼 펼치기/접기">
        <span aria-hidden="true">☰</span>
      </button>
      <div class="header-text">
        <h1>여비정산신청서 작성</h1>
        <p class="subtitle">폼에서 한꺼번에 입력하거나, 미리보기에서 누름틀을 직접 클릭해 수정할 수 있습니다.</p>
      </div>
    </header>

    <div class="app-body">
      <!-- 입력 폼 -->
      <section class="form-pane" aria-label="입력 폼">
        <form id="trip-form" autocomplete="off">
          <fieldset class="applicant-fieldset">
            <legend class="applicant-legend">
              <span>신청자 정보</span>
              <button type="button" id="btn-save-applicant" class="applicant-legend-button" title="브라우저에만 저장됩니다">저장</button>
              <button type="button" id="btn-clear-applicants" class="applicant-legend-button applicant-legend-button--danger">전체 삭제</button>
            </legend>
            <label>소속 <input name="소속" type="text" list="applicant-org-options" autocomplete="organization" required /></label>
            <label>직급 <input name="직급" type="text" list="applicant-position-options" autocomplete="organization-title" required /></label>
            <label>성명 <input name="성명" type="text" list="applicant-name-options" autocomplete="name" required /></label>
            <datalist id="applicant-org-options"></datalist>
            <datalist id="applicant-position-options"></datalist>
            <datalist id="applicant-name-options"></datalist>
            <label class="signature-control">도장/서명 이미지
              <span class="signature-control__row">
                <input id="signature-image" type="file" accept="image/png,image/jpeg,image/gif,image/bmp" />
                <button type="button" id="btn-clear-signature" class="signature-control__button" disabled>문서 삭제</button>
              </span>
              <span class="signature-control__actions">
                <button type="button" id="btn-save-signature" class="signature-control__button" title="브라우저에만 저장됩니다" disabled>브라우저 저장</button>
                <button type="button" id="btn-clear-saved-signature" class="signature-control__button signature-control__button--danger" title="브라우저에 저장된 도장/서명 이미지를 삭제합니다" disabled>저장 삭제</button>
              </span>
            </label>
          </fieldset>

          <fieldset>
            <legend>출장 일시 / 장소</legend>
            <label>시작 일시
              <span class="datetime-picker" data-datetime-picker="시작일시" data-datetime-placeholder="시작 일시 선택" data-datetime-default-hour="09">
                <input name="시작일시" type="hidden" />
              </span>
            </label>
            <label>종료 일시
              <span class="datetime-picker" data-datetime-picker="종료일시" data-datetime-placeholder="종료 일시 선택" data-datetime-default-hour="18">
                <input name="종료일시" type="hidden" />
              </span>
            </label>
            <label>출장지 <input name="출장지" type="text" required /></label>
          </fieldset>

          <fieldset>
            <legend>갈 때</legend>
            <label>일자 <input name="갈때일자" type="date" required /></label>
            <label>교통편
              <select name="갈때교통편" required>
                <option value="">선택</option>
                <option>자가용</option>
                <option>버스</option>
                <option>기차/KTX</option>
                <option>항공</option>
                <option>지하철</option>
                <option>택시</option>
              </select>
            </label>
            <label>출발지 <input name="갈때출발지" type="text" required /></label>
            <label>도착지 <input name="갈때도착지" type="text" required /></label>
          </fieldset>

          <fieldset>
            <legend>올 때</legend>
            <label>일자 <input name="올때일자" type="date" required /></label>
            <label>교통편
              <select name="올때교통편" required>
                <option value="">선택</option>
                <option>자가용</option>
                <option>버스</option>
                <option>기차/KTX</option>
                <option>항공</option>
                <option>지하철</option>
                <option>택시</option>
              </select>
            </label>
            <label>출발지 <input name="올때출발지" type="text" required /></label>
            <label>도착지 <input name="올때도착지" type="text" required /></label>
          </fieldset>

          <fieldset>
            <legend>기타</legend>
            <label>제출 날짜 <input name="제출날짜" type="date" required /></label>
            <label>첨부서류 (텍스트)
              <textarea name="첨부서류" rows="3" placeholder="예: 주유영수증 1매, 하이패스영수증 1매"></textarea>
            </label>
          </fieldset>

          <div class="actions">
            <button type="button" id="btn-apply">미리보기에 반영</button>
            <button type="button" id="btn-download-hwp">HWP 다운로드</button>
            <button type="button" id="btn-print">PDF로 저장 / 인쇄</button>
            <button type="button" id="btn-reset">초기화</button>
          </div>

          <p class="status" id="status">양식을 불러오는 중...</p>
        </form>
      </section>

      <!-- 미리보기 -->
      <section class="preview-pane" aria-label="미리보기">
        <div id="scroll-container">
          <div id="scroll-content"></div>
        </div>
      </section>
    </div>

    <footer class="app-footer">
      <span>강원 설악고등학교 교사 남궁연</span>
      <span class="app-footer__divider" aria-hidden="true">·</span>
      <span>HWP 처리 엔진: <a href="https://github.com/edwardkim/rhwp" target="_blank" rel="noopener noreferrer">rhwp (@rhwp/core, MIT)</a></span>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
